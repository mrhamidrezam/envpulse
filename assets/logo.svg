<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg-grad)" stroke="#334155" stroke-width="6"/>

  <!-- Subtle Shield Background -->
  <path d="M256 90 L380 145 V255 C380 340 325 400 256 425 C187 400 132 340 132 255 V145 Z" fill="url(#shield-grad)" stroke="#4f46e5" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Code Key/Value Brackets -->
  <path d="M190 190 L150 230 L190 270" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M322 190 L362 230 L322 270" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Pulse & Lightning Wave -->
  <path d="M110 256 H175 L205 185 L245 330 L275 220 L295 275 L315 256 H402" fill="none" stroke="url(#pulse-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Center Key Lock Node -->
  <circle cx="256" cy="256" r="28" fill="#0f172a" stroke="#10b981" stroke-width="6"/>
  <circle cx="256" cy="256" r="10" fill="#38bdf8"/>

  <!-- Binary / Node Dots -->
  <circle cx="205" cy="185" r="7" fill="#38bdf8"/>
  <circle cx="245" cy="330" r="7" fill="#6366f1"/>
  <circle cx="275" cy="220" r="7" fill="#10b981"/>
</svg>
